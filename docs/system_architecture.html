<style>
  :root{
    --bg:#eef2f6; --panel:#ffffff; --ink:#22303c; --muted:#5c6b7a;
    --line:#8ea0b2; --faint:#aab6c2;
    --accent:#0e8f83; --accent-ink:#0b6d64;
    --human:#e05a3f; --data:#2f6fdb; --amber:#c9760f;
    --chip:#f3f7f9; --chip-stroke:#d8e2e8; --box-stroke:#c2cfd9;
    --tint-ext:#fbf1ec; --ext-stroke:#ecccbf; --ext-ink:#b25a3c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1620; --panel:#18232f; --ink:#e6edf3; --muted:#93a2b2;
      --line:#4a5c6e; --faint:#3c4c5c;
      --accent:#33c9ba; --accent-ink:#5fded1;
      --human:#f8836b; --data:#6ea6f5; --amber:#e0a24a;
      --chip:#1e2b38; --chip-stroke:#2c3d4d; --box-stroke:#33465a;
      --tint-ext:#2a2320; --ext-stroke:#5a4034; --ext-ink:#f0a888;
    }
  }
  :root[data-theme="light"]{
    --bg:#eef2f6; --panel:#ffffff; --ink:#22303c; --muted:#5c6b7a;
    --line:#8ea0b2; --faint:#aab6c2;
    --accent:#0e8f83; --accent-ink:#0b6d64;
    --human:#e05a3f; --data:#2f6fdb; --amber:#c9760f;
    --chip:#f3f7f9; --chip-stroke:#d8e2e8; --box-stroke:#c2cfd9;
    --tint-ext:#fbf1ec; --ext-stroke:#ecccbf; --ext-ink:#b25a3c;
  }
  :root[data-theme="dark"]{
    --bg:#0f1620; --panel:#18232f; --ink:#e6edf3; --muted:#93a2b2;
    --line:#4a5c6e; --faint:#3c4c5c;
    --accent:#33c9ba; --accent-ink:#5fded1;
    --human:#f8836b; --data:#6ea6f5; --amber:#e0a24a;
    --chip:#1e2b38; --chip-stroke:#2c3d4d; --box-stroke:#33465a;
    --tint-ext:#2a2320; --ext-stroke:#5a4034; --ext-ink:#f0a888;
  }

  html,body{ margin:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Segoe UI","Leelawadee UI","Noto Sans Thai","Sarabun",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    padding:24px 16px 32px;
  }
  .wrap{ max-width:1180px; margin:0 auto; }
  .figure{ overflow-x:auto; }
  svg.arch{ display:block; width:100%; height:auto; min-width:820px; }

  /* SVG element styling via theme tokens */
  svg text{ fill:var(--ink); }
  .t-title{ font-size:29px; font-weight:700; letter-spacing:.2px; }
  .t-sub{ font-size:13.5px; fill:var(--muted); }
  .t-box{ font-size:14.5px; font-weight:600; }
  .t-server{ font-size:15px; font-weight:700; fill:var(--accent-ink); }
  .t-ext{ font-size:14px; font-weight:600; fill:var(--ext-ink); }
  .t-th{ font-size:12.5px; }
  .t-en{ font-size:10.5px; fill:var(--muted); }
  .cap-th{ font-size:13.5px; font-weight:600; }
  .cap-en{ font-size:10.5px; fill:var(--muted); }
  .lbl{ font-size:11.5px; fill:var(--muted); paint-order:stroke; stroke:var(--bg); stroke-width:4px; stroke-linejoin:round; }

  .box{ fill:var(--panel); stroke:var(--box-stroke); stroke-width:2; }
  .box-server{ fill:var(--panel); stroke:var(--accent); stroke-width:2.4; }
  .box-faint{ fill:var(--panel); stroke:var(--faint); stroke-width:1.6; stroke-dasharray:5 4; }
  .panel-ext{ fill:var(--tint-ext); stroke:var(--ext-stroke); stroke-width:2; }
  .chip{ fill:var(--chip); stroke:var(--chip-stroke); stroke-width:1.4; }

  .icon{ fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .icon .fill{ fill:currentColor; stroke:none; }

  .link{ fill:none; stroke:var(--accent); stroke-width:2.2; }
  .link-ext{ fill:none; stroke:var(--line); stroke-width:1.8; stroke-dasharray:6 5; }
  .link-faint{ fill:none; stroke:var(--faint); stroke-width:1.6; stroke-dasharray:3 5; }
  #ah-accent path{ fill:var(--accent); }
  #ah-line path{ fill:var(--line); }
  #ah-faint path{ fill:var(--faint); }
</style>

<div class="wrap">

        </marker>
        <marker id="ah-line" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="9.5" refY="6" orient="auto">
          <path d="M1.5 1.5 L10.5 6 L1.5 10.5 Z"/>
        </marker>
        <marker id="ah-faint" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5.5" orient="auto">
          <path d="M1.5 1.5 L10 5.5 L1.5 9.5 Z"/>

        <!-- ===== Icon symbols (24x24) ===== -->
        <symbol id="i-people" viewBox="0 0 24 24">

        <symbol id="i-cloud" viewBox="0 0 24 24">

          <rect class="fill" x="16.2" y="5" width="2.6" height="12.5" rx=".5"/>
        </symbol>
        <symbol id="i-chat" viewBox="0 0 24 24">
          <rect class="icon" x="2.8" y="4.5" width="18.4" height="12.4" rx="2.6"/>
          <path class="icon" d="M8 16.9v3.4l4.2-3.4"/>
          <line class="icon" x1="6.6" y1="9" x2="17.4" y2="9"/>
          <line class="icon" x1="6.6" y1="12.4" x2="14" y2="12.4"/>
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle class="icon" cx="12" cy="12" r="8.6"/>
          <path class="icon" d="M12 6.8v5.4l3.6 2.1"/>
        </symbol>
        <symbol id="i-db" viewBox="0 0 24 24">
          <ellipse class="icon" cx="12" cy="5.4" rx="7.4" ry="2.7"/>
          <path class="icon" d="M4.6 5.4v13.2c0 1.5 3.3 2.7 7.4 2.7s7.4-1.2 7.4-2.7V5.4"/>
          <path class="icon" d="M4.6 12c0 1.5 3.3 2.7 7.4 2.7s7.4-1.2 7.4-2.7"/>
        </symbol>
        <symbol id="i-cog" viewBox="0 0 24 24">
          <path class="icon" d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/>

      </defs>

      <!-- ===== Title ===== -->
      <text class="t-title" x="600" y="42" text-anchor="middle">แผนผังสถาปัตยกรรมระบบ · System Architecture</text>
      <text class="t-sub" x="600" y="66" text-anchor="middle">ระบบพยากรณ์ PM2.5 ล่วงหน้า 24 ชม. จ.ขอนแก่น — PM2.5 24-Hour Forecast &amp; Health Advisory (Khon Kaen)</text>

      <use href="#i-laptop" x="272" y="426" width="46" height="40" style="color:var(--accent)"/>
      <text class="t-en" x="266" y="498" text-anchor="middle">ติดตั้งได้ · ออฟไลน์ (Service Worker)</text>

      <!-- ===== Flask server ===== -->

      <rect class="chip" x="488" y="334" width="264" height="46" rx="10"/>
      <use href="#i-switch" x="498" y="345" width="24" height="24" style="color:var(--accent)"/>

      <rect class="chip" x="488" y="388" width="264" height="50" rx="10"/>
      <use href="#i-chart" x="498" y="401" width="24" height="24" style="color:var(--amber)"/>
      <text class="t-th" x="532" y="410">โมเดลพยากรณ์ 3 ตัว</text>
      <text class="t-en" x="532" y="426">LightGBM · XGBoost · Prophet</text>

      <rect class="chip" x="488" y="446" width="264" height="46" rx="10"/>
      <use href="#i-chat" x="498" y="457" width="24" height="24" style="color:var(--data)"/>
      <text class="t-th" x="532" y="467">สร้างคำอธิบาย (NLG รายวัน)</text>
      <text class="t-en" x="532" y="483">Gemini + Safety check</text>

      <text class="t-en" x="620" y="524" text-anchor="middle">+ REST API · Auth (session) · เสิร์ฟ SPA · SHAP · Risk score</text>

      <!-- ===== PostgreSQL ===== -->
      <use href="#i-db" x="574" y="584" width="92" height="92" style="color:var(--data)"/>
      <text class="cap-th" x="620" y="694" text-anchor="middle">PostgreSQL · pm25_forecast</text>
      <text class="cap-en" x="620" y="711" text-anchor="middle">4 ตาราง: predictions · nlg · notifications · users</text>

      <text class="t-en" x="926" y="535">station 7747 / sensor 1304249</text>

      <rect class="box-faint" x="150" y="600" width="256" height="96" rx="12"/>
      <text class="t-box" x="278" y="626" text-anchor="middle" style="fill:var(--muted)">ขั้นตอนออฟไลน์ / Offline</text>
      <use href="#i-cog" x="166" y="646" width="22" height="22" style="color:var(--faint)"/>
      <text class="t-en" x="198" y="655" >scripts/ — เทรน &amp; fit calibration</text>
      <text class="t-en" x="198" y="675" >OpenAQ + data/*.csv → models/*.pkl</text>

      <text class="lbl" x="155" y="438" text-anchor="middle">ใช้งาน</text>

      <line class="link-ext" x1="770" y1="470" x2="870" y2="470" marker-end="url(#ah-line)"/>

      <!-- ===== Legend ===== -->

  </div>
</div>
