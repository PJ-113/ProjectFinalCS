<style>
  :root{
    --bg:#ffffff; --border:#c9d3dc; --ink:#2b3744;
    --muted:#64748b; --accent:#2f6fdb; --accent-soft:#eaf1fc;
    --box-stroke:#d7dee6; --box-fill:#ffffff;
    --ext-fill:#fdf1ea; --ext-stroke:#f0d2bb; --ext-ink:#b2602e;
    --arrow:#9aa7b4; --label:#6b7684;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1620; --border:#33465a; --ink:#e6edf3; --muted:#93a2b2;
      --accent:#6ea6f5; --accent-soft:#1c2a3b;
      --box-stroke:#33465a; --box-fill:#161f2b;
      --ext-fill:#2a2015; --ext-stroke:#5a4228; --ext-ink:#e3a978;
      --arrow:#4a5c6e; --label:#93a2b2;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1620; --border:#33465a; --ink:#e6edf3; --muted:#93a2b2;
    --accent:#6ea6f5; --accent-soft:#1c2a3b;
    --box-stroke:#33465a; --box-fill:#161f2b;
    --ext-fill:#2a2015; --ext-stroke:#5a4228; --ext-ink:#e3a978;
    --arrow:#4a5c6e; --label:#93a2b2;
    color-scheme: dark;
  }

  html,body{ margin:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Segoe UI","Leelawadee UI","Noto Sans Thai","Sarabun",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    padding:24px 16px 32px;
  }
  .wrap{ max-width:1100px; margin:0 auto; }
  .figure{ overflow-x:auto; }
  svg.arch{ display:block; width:100%; height:auto; min-width:760px; }
  .caption{ text-align:center; font-size:14px; margin-top:14px; color:var(--ink); }

  svg text{ fill:var(--ink); }
  .t-box{ font-size:15px; font-weight:700; }
  .t-row{ font-size:12.5px; }
  .t-ext-title{ font-size:14px; font-weight:700; fill:var(--ext-ink); }
  .t-ext-row{ font-size:12.5px; fill:var(--ext-ink); }
  .t-actor{ font-size:12.5px; }
  .lbl{ font-size:11px; fill:var(--label); }

  .box{ fill:var(--box-fill); stroke:var(--box-stroke); stroke-width:1.6; }
  .row{ fill:var(--accent-soft); stroke:none; }
  .ext-box{ fill:var(--ext-fill); stroke:var(--ext-stroke); stroke-width:1.6; }
  .frame{ fill:none; stroke:var(--muted); stroke-width:1.6; stroke-dasharray:6 5; }
  .t-frame{ font-size:13px; font-weight:700; fill:var(--muted); }

  .icon{ fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .icon-fill{ fill:currentColor; stroke:none; }

  .arrow{ fill:none; stroke:var(--arrow); stroke-width:1.6; }
  #ah path{ fill:var(--arrow); }
</style>

<div class="wrap">
  <div class="figure">
    <svg class="arch" viewBox="0 0 1040 560" role="img"
         aria-label="ภาพรวมของสถาปัตยกรรมระบบ ของระบบพยากรณ์ค่า PM2.5 และให้คำแนะนำด้านสุขภาพอากาศตามกลุ่มผู้ใช้">

      <defs>
        <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
          <path d="M1 1 L9 5 L1 9 Z"/>
        </marker>

        <!-- Classic UML stick-figure actor, same style as usecase_diagram -->
        <symbol id="i-actor" viewBox="0 0 24 24">
          <circle class="icon" cx="12" cy="4.6" r="2.6"/>
          <line class="icon" x1="12" y1="7.2" x2="12" y2="15"/>
          <line class="icon" x1="6" y1="10" x2="18" y2="10"/>
          <line class="icon" x1="12" y1="15" x2="7" y2="21.5"/>
          <line class="icon" x1="12" y1="15" x2="17" y2="21.5"/>
        </symbol>
        <symbol id="i-laptop" viewBox="0 0 24 24">
          <rect class="icon" x="4" y="5.5" width="16" height="10.5" rx="1.4"/>
          <path class="icon" d="M2 19h20"/>
        </symbol>
        <symbol id="i-globe" viewBox="0 0 24 24">
          <circle class="icon" cx="12" cy="12" r="9.2"/>
          <ellipse class="icon" cx="12" cy="12" rx="4" ry="9.2"/>
          <line class="icon" x1="2.8" y1="12" x2="21.2" y2="12"/>
          <path class="icon" d="M4.3 7.2h15.4"/>
          <path class="icon" d="M4.3 16.8h15.4"/>
        </symbol>
        <symbol id="i-bolt" viewBox="0 0 24 24">
          <path class="icon" d="M12.8 2.5 5 13.6h5.3l-1.1 8 7.8-11.6h-5.3z"/>
        </symbol>
        <symbol id="i-branch" viewBox="0 0 24 24">
          <circle class="icon" cx="12" cy="4.5" r="2.2"/>
          <path class="icon" d="M12 6.7v4.3"/>
          <path class="icon" d="M12 11a6 6 0 0 0-6 6v1"/>
          <path class="icon" d="M12 11a6 6 0 0 1 6 6v1"/>
          <circle class="icon" cx="6" cy="19.5" r="2.2"/>
          <circle class="icon" cx="18" cy="19.5" r="2.2"/>
        </symbol>
        <symbol id="i-pulse" viewBox="0 0 24 24">
          <path class="icon" d="M2.5 12h4l2-6 3 12 2.5-9 1.5 3h6.5"/>
        </symbol>
        <symbol id="i-chip" viewBox="0 0 24 24">
          <rect class="icon" x="6" y="6" width="12" height="12" rx="1.6"/>
          <path class="icon" d="M9 2.5v3M15 2.5v3M9 18.5v3M15 18.5v3M2.5 9h3M2.5 15h3M18.5 9h3M18.5 15h3"/>
        </symbol>
        <symbol id="i-db" viewBox="0 0 24 24">
          <ellipse class="icon" cx="12" cy="5.2" rx="7.4" ry="2.6"/>
          <path class="icon" d="M4.6 5.2v13.2c0 1.44 3.3 2.6 7.4 2.6s7.4-1.16 7.4-2.6V5.2"/>
          <path class="icon" d="M4.6 11.8c0 1.44 3.3 2.6 7.4 2.6s7.4-1.16 7.4-2.6"/>
        </symbol>
        <symbol id="i-cloud" viewBox="0 0 24 24">
          <path class="icon" d="M7 18h9.6a4 4 0 0 0 .5-8 5.6 5.6 0 0 0-10.7-1.3A3.7 3.7 0 0 0 7 18Z"/>
        </symbol>
        <symbol id="i-chat" viewBox="0 0 24 24">
          <rect class="icon" x="2.8" y="4.5" width="18.4" height="12.4" rx="2.6"/>
          <path class="icon" d="M8 16.9v3.4l4.2-3.4"/>
          <line class="icon" x1="6.6" y1="9" x2="17.4" y2="9"/>
          <line class="icon" x1="6.6" y1="12.4" x2="14" y2="12.4"/>
        </symbol>
      </defs>

      <g transform="translate(44,0)">

      <!-- Actors (ตัวก้างคลาสสิก เหมือน usecase diagram) -->
      <use href="#i-actor" x="44" y="88" width="34" height="34" style="color:var(--ink)"/>
      <text class="t-actor" x="61" y="140" text-anchor="middle">ผู้ใช้ทั่วไป</text>

      <use href="#i-actor" x="44" y="208" width="34" height="34" style="color:var(--ink)"/>
      <text class="t-actor" x="61" y="260" text-anchor="middle">ผู้ใช้ที่ลงทะเบียน</text>

      <!-- Actor -> Web arrows -->
      <path class="arrow" d="M90 107 L200 165" marker-end="url(#ah)"/>
      <text class="lbl" x="130" y="118">HTTPS</text>
      <path class="arrow" d="M90 227 L200 190" marker-end="url(#ah)"/>
      <text class="lbl" x="130" y="238">HTTPS</text>

      <!-- Web box -->
      <rect class="box" x="208" y="140" width="150" height="110" rx="14"/>
      <text class="t-box" x="283" y="166" text-anchor="middle">หน้าเว็บ</text>
      <use href="#i-laptop" x="259" y="182" width="48" height="40" style="color:var(--accent)"/>
      <text class="t-row" x="283" y="238" text-anchor="middle">Vue 3 · PWA</text>

      <!-- Web <-> Internet -->
      <path class="arrow" d="M362 182 L390 182" marker-end="url(#ah)"/>
      <text class="lbl" x="376" y="174" text-anchor="middle">คำขอ</text>
      <path class="arrow" d="M390 210 L362 210" marker-end="url(#ah)"/>
      <text class="lbl" x="391" y="242" text-anchor="middle">ตอบกลับ</text>

      <!-- Internet (globe) -->
      <use href="#i-globe" x="395" y="165" width="50" height="50" style="color:var(--accent)"/>
      <text class="lbl" x="431" y="150" text-anchor="middle">HTTPS / REST API</text>

      <!-- Internet <-> Server -->
      <path class="arrow" d="M450 182 L496 182" marker-end="url(#ah)"/>
      <text class="lbl" x="473" y="174" text-anchor="middle">คำขอ</text>
      <path class="arrow" d="M496 210 L450 210" marker-end="url(#ah)"/>
      <text class="lbl" x="473" y="242" text-anchor="middle">ตอบกลับ</text>

      <!-- Server box -->
      <rect class="box" x="504" y="110" width="270" height="296" rx="14"/>
      <text class="t-box" x="639" y="136" text-anchor="middle">เซิร์ฟเวอร์</text>

      <rect class="row" x="520" y="150" width="238" height="40" rx="9"/>
      <use href="#i-bolt" x="530" y="159" width="22" height="22" style="color:var(--accent)"/>
      <text class="t-row" x="562" y="175">Flask API (Python)</text>

      <rect class="row" x="520" y="198" width="238" height="40" rx="9"/>
      <use href="#i-branch" x="530" y="207" width="22" height="22" style="color:var(--accent)"/>
      <text class="t-row" x="562" y="223">Routing + Circuit Breaker</text>

      <rect class="row" x="520" y="246" width="238" height="40" rx="9"/>
      <use href="#i-chip" x="530" y="255" width="22" height="22" style="color:var(--accent)"/>
      <text class="t-row" x="562" y="271">โมเดล ML: LightGBM · XGBoost</text>

      <rect class="row" x="520" y="294" width="238" height="40" rx="9"/>
      <use href="#i-pulse" x="530" y="303" width="22" height="22" style="color:var(--accent)"/>
      <text class="t-row" x="562" y="319">Risk Scoring</text>

      <rect class="row" x="520" y="342" width="238" height="40" rx="9"/>
      <use href="#i-chat" x="530" y="351" width="22" height="22" style="color:var(--accent)"/>
      <text class="t-row" x="562" y="367">NLG + Safety Check</text>

      <!-- Server <-> DB -->
      <path class="arrow" d="M774 170 L836 170" marker-end="url(#ah)"/>
      <path class="arrow" d="M836 200 L774 200" marker-end="url(#ah)"/>
      <text class="lbl" x="805" y="162" text-anchor="middle">สอบถาม</text>
      <text class="lbl" x="805" y="216" text-anchor="middle">ข้อมูล</text>

      <!-- Database -->
      <use href="#i-db" x="840" y="154" width="56" height="56" style="color:var(--accent)"/>
      <text class="t-box" x="868" y="244" text-anchor="middle">ฐานข้อมูล</text>
      <text class="t-row" x="868" y="264" text-anchor="middle">PostgreSQL</text>

      <!-- ระบบภายใน frame: wraps User -> Web -> Server -> DB only, not External Services -->
      <rect class="frame" x="18" y="58" width="940" height="358" rx="16"/>
      <text class="t-frame" x="34" y="78">ระบบภายใน</text>

      <!-- Server <-> External (bidirectional) -->
      <path class="arrow" d="M622 406 L622 430" marker-end="url(#ah)"/>
      <text class="lbl" x="604" y="428" text-anchor="end">คำขอ</text>
      <path class="arrow" d="M656 430 L656 406" marker-end="url(#ah)"/>
      <text class="lbl" x="674" y="428" text-anchor="start">ตอบกลับ</text>
      <text class="lbl" x="639" y="398" text-anchor="middle">HTTPS · เรียก API</text>

      <!-- External services -->
      <rect class="ext-box" x="479" y="434" width="320" height="100" rx="16"/>
      <use href="#i-cloud" x="622" y="444" width="34" height="26" style="color:var(--ext-ink)"/>
      <text class="t-ext-title" x="639" y="488" text-anchor="middle">บริการภายนอก (External Services)</text>
      <text class="t-ext-row" x="639" y="508" text-anchor="middle">OpenAQ · Open-Meteo</text>
      <text class="t-ext-row" x="639" y="526" text-anchor="middle">NASA FIRMS · Google Gemini</text>

      </g>
    </svg>
  </div>
  <div class="caption">ภาพที่ 2 ภาพรวมของสถาปัตยกรรมระบบ ของระบบพยากรณ์ค่า PM2.5 และให้คำแนะนำด้านสุขภาพอากาศตามกลุ่มผู้ใช้</div>
</div>
