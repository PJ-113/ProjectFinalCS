<style>
  :root{
    --bg:#ffffff; --ink:#2b3744; --muted:#6b7684;
    --head:#f3e7c4; --head-ink:#3a3426; --head-stroke:#e2d2a0;
    --body-fill:#ffffff; --body-stroke:#d7dee6; --sep:#ecd9ab;
    --pk:#b8860b; --type:#8a97a6; --note:#6b7684;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1620; --ink:#e6edf3; --muted:#93a2b2;
      --head:#3a331f; --head-ink:#f0dfa8; --head-stroke:#5a4e2c;
      --body-fill:#161f2b; --body-stroke:#33465a; --sep:#4a3f24;
      --pk:#e0b24a; --type:#7c8ba0; --note:#93a2b2;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1620; --ink:#e6edf3; --muted:#93a2b2;
    --head:#3a331f; --head-ink:#f0dfa8; --head-stroke:#5a4e2c;
    --body-fill:#161f2b; --body-stroke:#33465a; --sep:#4a3f24;
    --pk:#e0b24a; --type:#7c8ba0; --note:#93a2b2;
  }

  html,body{ margin:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Segoe UI","Leelawadee UI","Noto Sans Thai","Sarabun",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    padding:24px 16px 32px;
  }
  .wrap{ max-width:1180px; margin:0 auto; }
  .figure{ overflow-x:auto; }
  svg.erd{ display:block; width:100%; height:auto; min-width:900px; }
  .caption{ text-align:center; font-size:14px; margin-top:14px; }

  svg text{ fill:var(--ink); }
  .t-head{ font-size:13px; font-weight:700; fill:var(--head-ink); letter-spacing:.3px; }
  .t-col{ font-size:12px; }
  .t-col-pk{ font-size:12px; font-weight:700; }
  .t-type{ font-size:10.5px; fill:var(--type); }
  .t-pk-badge{ font-size:9.5px; font-weight:700; fill:var(--pk); }
  .t-note{ font-size:12px; fill:var(--note); }

  .head{ fill:var(--head); stroke:var(--head-stroke); stroke-width:1.4; }
  .bodybox{ fill:var(--body-fill); stroke:var(--body-stroke); stroke-width:1.4; }
  .sep{ stroke:var(--sep); stroke-width:1; }
</style>

<div class="wrap">
  <div class="figure">
    <svg class="erd" viewBox="0 0 1220 400" role="img"
         aria-label="Entity Relationship Diagram ของระบบพยากรณ์ PM2.5">

      <!-- ============ USERS ============ -->
      <g>
        <rect class="head" x="40" y="50" width="250" height="34" rx="8"/>
        <text class="t-head" x="165" y="72" text-anchor="middle">USERS</text>
        <rect class="bodybox" x="40" y="84" width="250" height="134" rx="0"/>
        <line class="sep" x1="40" y1="84" x2="290" y2="84"/>

        <!-- rows: id, email, password_hash, risk_group, age, created_at -->
        <text class="t-pk-badge" x="52" y="100">PK</text>
        <text class="t-col-pk" x="76" y="100">id</text>
        <text class="t-type" x="278" y="100" text-anchor="end">SERIAL</text>
        <line class="sep" x1="40" y1="106" x2="290" y2="106"/>

        <text class="t-col" x="76" y="122">email</text>
        <text class="t-type" x="278" y="122" text-anchor="end">TEXT · UNIQUE</text>
        <line class="sep" x1="40" y1="128" x2="290" y2="128"/>

        <text class="t-col" x="76" y="144">password_hash</text>
        <text class="t-type" x="278" y="144" text-anchor="end">TEXT</text>
        <line class="sep" x1="40" y1="150" x2="290" y2="150"/>

        <text class="t-col" x="76" y="166">risk_group</text>
        <text class="t-type" x="278" y="166" text-anchor="end">TEXT</text>
        <line class="sep" x1="40" y1="172" x2="290" y2="172"/>

        <text class="t-col" x="76" y="188">age</text>
        <text class="t-type" x="278" y="188" text-anchor="end">INTEGER</text>
        <line class="sep" x1="40" y1="194" x2="290" y2="194"/>

        <text class="t-col" x="76" y="210">created_at</text>
        <text class="t-type" x="278" y="210" text-anchor="end">TEXT</text>
      </g>

      <!-- ============ PREDICTION_LOG ============ -->
      <g>
        <rect class="head" x="320" y="50" width="280" height="34" rx="8"/>
        <text class="t-head" x="460" y="72" text-anchor="middle">PREDICTION_LOG</text>
        <rect class="bodybox" x="320" y="84" width="280" height="222" rx="0"/>
        <line class="sep" x1="320" y1="84" x2="600" y2="84"/>

        <text class="t-pk-badge" x="332" y="100">PK</text>
        <text class="t-col-pk" x="356" y="100">id</text>
        <text class="t-type" x="588" y="100" text-anchor="end">SERIAL</text>
        <line class="sep" x1="320" y1="106" x2="600" y2="106"/>

        <text class="t-col" x="356" y="122">predicted_at_utc</text>
        <text class="t-type" x="588" y="122" text-anchor="end">TEXT</text>
        <line class="sep" x1="320" y1="128" x2="600" y2="128"/>

        <text class="t-col" x="356" y="144">target_time_utc</text>
        <text class="t-type" x="588" y="144" text-anchor="end">TEXT</text>
        <line class="sep" x1="320" y1="150" x2="600" y2="150"/>

        <text class="t-col" x="356" y="166">horizon</text>
        <text class="t-type" x="588" y="166" text-anchor="end">INTEGER</text>
        <line class="sep" x1="320" y1="172" x2="600" y2="172"/>

        <text class="t-col" x="356" y="188">predicted_pm25</text>
        <text class="t-type" x="588" y="188" text-anchor="end">FLOAT</text>
        <line class="sep" x1="320" y1="194" x2="600" y2="194"/>

        <text class="t-col" x="356" y="210">actual_pm25</text>
        <text class="t-type" x="588" y="210" text-anchor="end">FLOAT</text>
        <line class="sep" x1="320" y1="216" x2="600" y2="216"/>

        <text class="t-col" x="356" y="232">model_used</text>
        <text class="t-type" x="588" y="232" text-anchor="end">TEXT</text>
        <line class="sep" x1="320" y1="238" x2="600" y2="238"/>

        <text class="t-col" x="356" y="254">source</text>
        <text class="t-type" x="588" y="254" text-anchor="end">TEXT</text>
        <line class="sep" x1="320" y1="260" x2="600" y2="260"/>

        <text class="t-col" x="356" y="276">actual_pm25_calibrated</text>
        <text class="t-type" x="588" y="276" text-anchor="end">FLOAT</text>
        <line class="sep" x1="320" y1="282" x2="600" y2="282"/>

        <text class="t-col" x="356" y="298">province</text>
        <text class="t-type" x="588" y="298" text-anchor="end">TEXT</text>
      </g>
      <text class="t-note" x="460" y="322" text-anchor="middle">UNIQUE (predicted_at_utc, horizon, province)</text>

      <!-- ============ DAILY_NLG_LOG ============ -->
      <g>
        <rect class="head" x="630" y="50" width="280" height="34" rx="8"/>
        <text class="t-head" x="770" y="72" text-anchor="middle">DAILY_NLG_LOG</text>
        <rect class="bodybox" x="630" y="84" width="280" height="178" rx="0"/>
        <line class="sep" x1="630" y1="84" x2="910" y2="84"/>

        <text class="t-pk-badge" x="642" y="100">PK</text>
        <text class="t-col-pk" x="666" y="100">id</text>
        <text class="t-type" x="898" y="100" text-anchor="end">SERIAL</text>
        <line class="sep" x1="630" y1="106" x2="910" y2="106"/>

        <text class="t-col" x="666" y="122">date_thai</text>
        <text class="t-type" x="898" y="122" text-anchor="end">TEXT</text>
        <line class="sep" x1="630" y1="128" x2="910" y2="128"/>

        <text class="t-col" x="666" y="144">daily_avg_pm25</text>
        <text class="t-type" x="898" y="144" text-anchor="end">FLOAT</text>
        <line class="sep" x1="630" y1="150" x2="910" y2="150"/>

        <text class="t-col" x="666" y="166">explanation_text</text>
        <text class="t-type" x="898" y="166" text-anchor="end">TEXT</text>
        <line class="sep" x1="630" y1="172" x2="910" y2="172"/>

        <text class="t-col" x="666" y="188">used_fallback</text>
        <text class="t-type" x="898" y="188" text-anchor="end">BOOLEAN</text>
        <line class="sep" x1="630" y1="194" x2="910" y2="194"/>

        <text class="t-col" x="666" y="210">generated_at_utc</text>
        <text class="t-type" x="898" y="210" text-anchor="end">TEXT</text>
        <line class="sep" x1="630" y1="216" x2="910" y2="216"/>

        <text class="t-col" x="666" y="232">risk_group</text>
        <text class="t-type" x="898" y="232" text-anchor="end">TEXT</text>
        <line class="sep" x1="630" y1="238" x2="910" y2="238"/>

        <text class="t-col" x="666" y="254">province</text>
        <text class="t-type" x="898" y="254" text-anchor="end">TEXT</text>
      </g>
      <text class="t-note" x="770" y="278" text-anchor="middle">UNIQUE (date_thai, risk_group, province)</text>

      <!-- ============ NOTIFICATION_LOG ============ -->
      <g>
        <rect class="head" x="940" y="50" width="240" height="34" rx="8"/>
        <text class="t-head" x="1060" y="72" text-anchor="middle">NOTIFICATION_LOG</text>
        <rect class="bodybox" x="940" y="84" width="240" height="90" rx="0"/>
        <line class="sep" x1="940" y1="84" x2="1180" y2="84"/>

        <text class="t-pk-badge" x="952" y="100">PK</text>
        <text class="t-col-pk" x="976" y="100">id</text>
        <text class="t-type" x="1168" y="100" text-anchor="end">SERIAL</text>
        <line class="sep" x1="940" y1="106" x2="1180" y2="106"/>

        <text class="t-col" x="976" y="122">recorded_at_utc</text>
        <text class="t-type" x="1168" y="122" text-anchor="end">TEXT</text>
        <line class="sep" x1="940" y1="128" x2="1180" y2="128"/>

        <text class="t-col" x="976" y="144">latest_pm25</text>
        <text class="t-type" x="1168" y="144" text-anchor="end">FLOAT</text>
        <line class="sep" x1="940" y1="150" x2="1180" y2="150"/>

        <text class="t-col" x="976" y="166">province</text>
        <text class="t-type" x="1168" y="166" text-anchor="end">TEXT</text>
      </g>
      <text class="t-note" x="1060" y="190" text-anchor="middle">UNIQUE (recorded_at_utc, province)</text>

      <!-- ============ Global note ============ -->
      <text class="t-note" x="610" y="360" text-anchor="middle">ทั้ง 4 ตารางไม่มีความสัมพันธ์แบบ Foreign Key ระหว่างกัน แต่ละตารางเป็น log อิสระ</text>
      <text class="t-note" x="610" y="378" text-anchor="middle">เชื่อมโยงกันด้วยการ query ตามเวลา/จังหวัดตอนเรียกใช้งานเท่านั้น (เช่น /api/notifications join recorded_at_utc = predicted_at_utc)</text>
    </svg>
  </div>
  <div class="caption">ภาพที่ 3 ER diagram ของระบบพยากรณ์ค่า PM2.5 และให้คำแนะนำด้านสุขภาพอากาศตามกลุ่มผู้ใช้</div>
</div>
