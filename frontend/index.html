<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6b7f96">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
    <title>พยากรณ์ PM2.5 - ภาคอีสาน</title>
    <!-- ตั้ง data-theme ก่อน render (กันจอสว่างวาบก่อนสลับเป็นมืด) — ต้องตรงกับ src/theme.js -->
    <script>
      (function () {
        var mode = null;
        try { mode = localStorage.getItem('pm25_theme'); } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', mode);
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
